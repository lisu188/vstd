name: vstd
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang clang-format libboost-filesystem-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - run: cmake --build build --target format-check
      - run: cmake --build build -j2
      - run: ctest --test-dir build --output-on-failure
  sanitizers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ['address,undefined', 'thread']
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizer address-space compatibility
        if: matrix.sanitizer == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: g++ -std=c++23 -O1 -g -pthread -I. -fno-omit-frame-pointer -fsanitize=${{ matrix.sanitizer }} tests/vmeta_regressions.cpp -o vmeta-sanitized
      - run: ./vmeta-sanitized
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
      - run: g++ -std=c++23 -O1 -g -pthread -I. -fno-omit-frame-pointer -fsanitize=${{ matrix.sanitizer }} tests/vneuro_tests.cpp -o vneuro-sanitized
      - run: ./vneuro-sanitized
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
