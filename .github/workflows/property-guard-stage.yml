name: property-guard-stage
on:
  push:
    branches: [staging/vmeta-property-guard]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format libboost-filesystem-dev
      - run: python3 scripts/property_guard_stage.py
        env:
          GH_TOKEN: ${{ github.token }}
